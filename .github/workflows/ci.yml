name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  bridge:
    name: Bridge (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm pack && mv claude-auto-bridge-*.tgz claude-auto-bridge.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: claude-auto-bridge
          path: bridge/claude-auto-bridge.tgz

  installers:
    name: Installer (${{ matrix.os }})
    needs: bridge
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLAUDE_AUTO_NO_SERVICE: "1"
      CLAUDE_AUTO_NO_PAIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: claude-auto-bridge
      - name: Install (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          CLAUDE_AUTO_PACKAGE="$PWD/claude-auto-bridge.tgz" bash install/install.sh < /dev/null
          ~/.local/bin/claude-auto-bridge version
          ~/.local/bin/claude-auto-bridge setup < /dev/null
          test -f ~/.claude-auto-bridge/bridge.env
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLAUDE_AUTO_PACKAGE = "$PWD\claude-auto-bridge.tgz"
          ./install/install.ps1
          & "$env:LOCALAPPDATA\ClaudeAuto\bin\claude-auto-bridge.cmd" version
          if (-not (Test-Path "$env:USERPROFILE\.claude-auto-bridge\bridge.env")) { throw 'setup did not write bridge.env' }
      - name: Start at sign-in (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bridge = "$env:LOCALAPPDATA\ClaudeAuto\bin\claude-auto-bridge.cmd"
          & $bridge service install
          $running = $false
          for ($i = 0; $i -lt 30 -and -not $running; $i++) { Start-Sleep 1; $running = (& $bridge service status) -match 'Running' }
          Get-Content "$env:USERPROFILE\.claude-auto-bridge\bridge.log" -ErrorAction SilentlyContinue
          & $bridge service uninstall
          if (-not $running) { throw 'The scheduled task did not start the bridge' }

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Smoke test
        uses: docker/build-push-action@v6
        with:
          context: bridge
          load: true
          tags: claude-auto-bridge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run --rm claude-auto-bridge:test claude-auto-bridge version
          docker run --rm claude-auto-bridge:test node -e "import('/app/dist/cli.js').then(m => { const p = m.bundledClaude(); console.log(p); if (!p) process.exit(1) })"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/claude-auto-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for Raspberry Pi (arm64) and PCs (amd64)
        uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core:test testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: claude-auto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
